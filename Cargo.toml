[package]
name = "kala"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Distributed-systems time primitives - Lamport, Hybrid Logical Clock, Interval Tree Clock."
repository = "https://github.com/protosphinx/kala"
readme = "README.md"
keywords = ["distributed-systems", "clock", "lamport", "hlc", "time"]
categories = ["data-structures", "concurrency"]

[dependencies]
serde_json = { version = "1.0", optional = true }

[dev-dependencies]

[features]
default = []
# Enables the `kala-mcp` binary and the `mcp` module: a stdio MCP
# (Model Context Protocol) server that exposes Lamport / HLC / Vector
# clock operations as tools an agent can call. Pulls in `serde_json`.
# Library consumers do not need this feature.
mcp = ["dep:serde_json"]

[[bin]]
name = "kala-mcp"
path = "src/bin/kala-mcp.rs"
required-features = ["mcp"]
